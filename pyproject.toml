# ---------------------------------------------------------------------------
# pyproject.toml — Italian specialized LLM (src layout, package "italian_llm")
# Build backend: setuptools. I pesi e le dipendenze pesanti restano opzionali:
# il repo deve risultare staticamente valido e importabile coi soli moduli puri.
# ---------------------------------------------------------------------------

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "italian-llm"
version = "0.3.0"
description = "LLM specializzato in italiano, end-to-end su base Qwen ~9B: CPT, SFT, preferenze (ORPO/DPO), distillazione, valutazione e serving."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Italian LLM Project Contributors" },
]
keywords = [
    "llm",
    "italian",
    "qwen",
    "qlora",
    "peft",
    "sft",
    "orpo",
    "dpo",
    "distillation",
    "nlp",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
    "Natural Language :: Italian",
]

# Solo le dipendenze leggere necessarie ai moduli "puri" (config, logging,
# prompts, schema, cleaning, safety). Le dipendenze pesanti (torch, transformers,
# peft, trl, datasets, vllm, ...) sono in requirements.txt e si installano a parte.
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Estensioni installabili "a la carte". Per il setup completo usare requirements.txt.
training = [
    "torch>=2.3",
    "transformers>=4.44",
    "datasets>=2.20",
    "tokenizers>=0.19",
    "peft>=0.12",
    "accelerate>=0.33",
    "trl>=0.9",
    "bitsandbytes>=0.43",
    "sentencepiece>=0.2",
]
serving = [
    "vllm>=0.5",
]
eval = [
    "evaluate>=0.4",
    "sacrebleu>=2.4",
    "rouge-score>=0.1.2",
    "langdetect>=1.0.9",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "black>=24.0",
]

[project.urls]
Homepage = "https://github.com/iAlias/italian-llm"
Documentation = "https://github.com/iAlias/italian-llm/tree/main/docs"
Repository = "https://github.com/iAlias/italian-llm"

# ---------------------------------------------------------------------------
# setuptools: src layout
# ---------------------------------------------------------------------------
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["italian_llm*"]

[tool.setuptools.package-data]
italian_llm = ["py.typed"]

# ---------------------------------------------------------------------------
# Ruff (lint)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear, C4: comprehensions.
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # lunghezza riga gestita da black/formatter
    "B008",  # chiamate nei default a volte intenzionali nei CLI
]

[tool.ruff.lint.isort]
known-first-party = ["italian_llm"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]  # sys.path.insert prima degli import: voluto nei CLI
"tests/*.py" = ["E402"]

# ---------------------------------------------------------------------------
# Black (format)
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
